<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>CAP Worker</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: 'intel-one-body-text', 'Inter', Helvetica, Arial, sans-serif;
			background: #121212;
			color: #ffffff;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			-webkit-font-smoothing: antialiased;
		}

		cap-widget {
			display: block;
			min-height: 80px;
			margin-bottom: 32px;
		}

		.credits {
			text-align: center;
			font-size: 14px;
			line-height: 21px;
			color: #ffffff;
		}

		.credits a {
			color: #ffffff;
			text-decoration: underline;
			font-weight: 400;
		}

		.credits a:hover {
			opacity: 0.8;
		}

		.credits p + p {
			margin-top: 4px;
		}
	</style>
	<script src="https://cap.bili33.top/cap.min.js"></script>
</head>
<body>
	<cap-widget id="cap" data-cap-api-endpoint="https://cap.bili33.top/api/"></cap-widget>

	<div class="credits">
		<p>Based on <a href="https://github.com/tiagozip/cap" target="_blank" rel="noopener noreferrer">tiagozip/cap</a></p>
		<p>Powered by <a href="https://github.com/xyTom/cap-worker" target="_blank" rel="noopener noreferrer">xyTom/cap-worker</a></p>
	</div>
</body>
</html>
